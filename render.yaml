# ─────────────────────────────────────────────────────────────────────────────
# ClipFarm — Render Blueprint (CF-68 · Production deployment)
#
# Defines the whole production stack as code: web + api + worker + Redis.
# Supabase (Postgres/Auth), Cloudflare R2 (storage) and Modal (GPU) stay as
# external managed services — their credentials are supplied as secrets below.
#
# First-time setup: Render Dashboard → New → Blueprint → connect
# ClipFarmVB/ClipFarm → branch `main`. Render reads this file and creates every
# service. Then fill the secrets (any env var shown as `sync: false`, plus the
# `clipfarm-shared` group). See DEPLOY_RENDER.md for the full checklist.
#
# Auto-deploy is deliberately OFF on all three services (see the note on
# clipfarm-api): the api's preDeployCommand runs Alembic migrations, and
# unattended schema changes on every merge to `main` is a failure mode this repo
# has already lived through. Deploy from the dashboard when a batch is ready.
# ─────────────────────────────────────────────────────────────────────────────

# Server secrets shared by api + worker. Filled once in the dashboard; both
# services reference this group via `fromGroup`.
envVarGroups:
  - name: clipfarm-shared
    envVars:
      # Turns on the required-settings check in api/app/config.py (CF-172): with
      # this set, api and worker refuse to start when any `sync: false` key
      # below is still absent, naming the ones that are missing. Without it a
      # blank DATABASE_URL falls back to a localhost default and the pre-deploy
      # migration dies with `Connect call failed ('127.0.0.1', 5432)` — which
      # reads as a Supabase outage, not as a missing variable.
      #
      # A literal `value:`, deliberately: Render only creates keys that carry
      # one, so this arrives on its own. A `sync: false` guard would be absent
      # in exactly the situation it exists to catch.
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL              # Supabase pooler URL, postgresql+asyncpg://…  (Pro tier — see CF-18)
        sync: false
      # The worker's per-game lock is a session-scoped Postgres advisory lock
      # (CF-184) and needs a SESSION-mode connection — Supabase's
      # transaction-mode pooler (port 6543) can serve consecutive statements
      # from different backends, which silently cannot hold one. Leave unset
      # while DATABASE_URL is the session-mode/direct connection (port 5432);
      # add it in the dashboard if DATABASE_URL ever moves to 6543. The worker
      # refuses to process rather than run under a lock that does not hold, so
      # the symptom is loud: `LockNotSessionScoped` in the worker log.
      # - key: LOCK_DATABASE_URL
      #   sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY # server-only secret
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        value: clipfarm
      - key: R2_PUBLIC_URL             # https://<bucket>.r2.dev or your R2 custom domain
        sync: false
      # Error monitoring (CF-89). api + worker share one DSN — worker events are
      # tagged service:worker. Blank DSN = Sentry disabled (no-op).
      - key: SENTRY_DSN                # Sentry → clipfarm-api → Settings → Client Keys (DSN)
        sync: false
      - key: SENTRY_ENVIRONMENT        # without this it defaults to "development"
        value: production

services:
  # ── Redis / Key Value (Celery broker + result backend) ─────────────────────
  # noeviction so a full instance never silently drops queued tasks.
  #
  # Do NOT drop this to `plan: free`: free Key Value instances have no data
  # persistence, so a restart loses every queued job — and since CF-65a landed,
  # in-flight ones too (acks_late keeps a task on the broker until it finishes,
  # so an unpersisted restart drops it). Paid plans persist by default
  # (journal + snapshot — up to ~1s of writes lost on restart), which is what
  # makes the queue survivable.
  - type: keyvalue
    name: clipfarm-redis
    region: oregon
    plan: starter
    maxmemoryPolicy: noeviction
    ipAllowList: []        # internal-only; no public access

  # ── API (FastAPI) ──────────────────────────────────────────────────────────
  - type: web
    name: clipfarm-api
    runtime: docker
    repo: https://github.com/ClipFarmVB/ClipFarm
    branch: main
    region: oregon
    plan: starter
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    # A script, not an inline command: this value is not tokenized the way a
    # shell would tokenize it, so a quoted body arrives as a single *word* —
    # `sh -c "VAR=x cmd args"` then dies with
    # `sh: 1: SENTRY_RELEASE=<sha> uvicorn ...: not found`, which reads like a
    # missing binary and is not (CF-170). The script binds Render's $PORT and
    # defaults SENTRY_RELEASE to $RENDER_GIT_COMMIT so events trace to a deploy.
    # Keep the logic there — do not inline it again, in this field or the
    # neighbouring preDeployCommand.
    # EXPOSE 8000 in the image is only documentation; the health check hits $PORT/healthz.
    dockerCommand: /app/scripts/render-start-api.sh
    # Point the platform health check at the SHALLOW liveness route, not the
    # deep /health readiness check (CF-89 makes /health return 503 when Postgres
    # or Redis is down). Coupling deploy gating / instance health to a dependency
    # blip would cycle a perfectly healthy API. The deep /health is for the
    # external uptime monitor instead.
    healthCheckPath: /healthz
    # Migrations run ONCE per deploy here — not on every container boot — so
    # replicas never race the schema and a shared DB isn't advanced by a stray
    # boot. Fixes the per-boot `alembic upgrade head` the dev compose file uses.
    # Also a script: this field carried the same `sh -c "…'…'"` shape the start
    # commands did, and it runs *before* the service starts — so if it parses the
    # same way, the deploy aborts here and the start script is never reached.
    preDeployCommand: /app/scripts/render-predeploy-api.sh
    # Deliberately OFF. With autoDeploy on, this preDeployCommand would run a
    # migration against the production database on every merge to main, with
    # nobody watching — the same unattended-schema-change class of failure as
    # the 007→008 crash-loop, one environment over. CONTRIBUTING treats landing
    # a migration as a coordinated step; this keeps prod consistent with that.
    # Deploy from the Render dashboard (or via a deploy hook) when a batch is
    # ready. Revisit once there's a staging environment to catch migrations
    # first. See DEPLOY_RENDER.md § Deploying a change.
    autoDeploy: false
    envVars:
      - fromGroup: clipfarm-shared
      - key: DEBUG
        value: "false"
      - key: JWT_SECRET               # legacy; Supabase JWKS is source of truth. Auto-generated.
        generateValue: true
      - key: API_BASE_URL             # this service's own public URL (custom domain or *.onrender.com)
        sync: false
      # Required since CF-172, and checked at startup like the shared-group
      # secrets: left unset the api boots clean, passes its health check, and
      # CORS-blocks every request from the real web origin — an outage with no
      # server-side symptom at all.
      - key: CORS_ORIGINS             # the web origin(s), comma-separated, e.g. https://clipfarm.ca
        sync: false
      - key: REDIS_URL
        fromService: { type: keyvalue, name: clipfarm-redis, property: connectionString }
      - key: CELERY_BROKER_URL
        fromService: { type: keyvalue, name: clipfarm-redis, property: connectionString }
      - key: CELERY_RESULT_BACKEND
        fromService: { type: keyvalue, name: clipfarm-redis, property: connectionString }

  # ── Worker (Celery) ────────────────────────────────────────────────────────
  # `standard` (2 GB / 1 CPU) since CF-240 — measured, not assumed. It ran on
  # `starter` (512 MB / 0.5 CPU) from CF-164, once ball tracking (CF-11) and
  # pose (CF-164) both moved to Modal and torch + ultralytics + Roboflow
  # `inference` stopped shipping in the image; what is left in this process is
  # ffmpeg, opencv, numpy and boto3.
  #
  # 512 MB was still not enough, and no game ever finished in production on it.
  # `libx264` peaks at ~407 MB even at threads=1 (CF-224) and this process holds
  # ~95 MB before ffmpeg starts — 502 MB against a 512 MB ceiling, which is noise
  # rather than headroom. The worker OOM-killed during cutting_clips on every
  # attempt: 5.5 s in on 20 Aug, and ~9 min in on 22 Aug pegged at 511.9/512 MB
  # the whole way.
  #
  # CF-239 stream-copies browser-safe sources and removes the re-encode for the
  # common case, but not for HEVC, VP9 or ProRes, which still need libx264 and
  # the same ~400 MB. So this is the prerequisite that makes CF-239 safe to
  # ship, not something CF-239 replaces. Revisit `starter` only once the
  # re-encode path is rare *and* peak memory has been measured on a real game.
  #
  # The other large allocation is the audio energy envelope — 16 kHz mono
  # float32 is ~150 MB of PCM for a 40-minute game. CF-164 streams that through
  # a temp file instead of subprocess capture_output, which was holding the
  # finished bytes and the chunk list they were accumulated from at the same
  # time; the peak is now one array rather than roughly two.
  #
  # An ML runtime back in the image would need `standard` anyway — a torch
  # import on 512 MB OOMs the box. api/tests/test_pose_modal.py pins the two
  # together, following `pip install -r` so the check isn't fooled by a
  # requirements file; it binds only while this says `starter`.
  #
  # No disk either: the model cache it pinned (~114 MB ball model + pose
  # weights) has nothing to hold now that no weights are downloaded here. That
  # also un-pins the single instance a disk forced, so horizontal scaling
  # (CF-65) is a numInstances change rather than a migration.
  #
  # Absent here is not the same as absent on the service (CF-225): the live
  # worker was still mounting the disk — 28 KB used of 974 MB — after this file
  # stopped declaring one. Confirm it under Disks in the dashboard and delete it
  # there before raising numInstances, because a service with a disk attached
  # cannot run more than one instance. See DEPLOY_RENDER.md § Notes & gotchas.
  - type: worker
    name: clipfarm-worker
    runtime: docker
    repo: https://github.com/ClipFarmVB/ClipFarm
    branch: main
    region: oregon
    plan: standard
    # Changing this plan is a two-file change (CF-241): docker-compose.yml pins
    # the dev worker's `mem_limit`, `memswap_limit` and `cpus` to whatever this
    # says, so that a laptop can reproduce the production box. Move them
    # together or the dev environment quietly stops being able to catch the
    # next CF-224. The same applies to FFMPEG_THREADS further down this file:
    # the dev worker matches whatever it says.
    #
    # api/tests/test_dev_prod_parity.py fails all of that apart — and note it
    # lives in api/tests/, which .hooks/pre-commit does NOT run, so a mismatch
    # surfaces in CI rather than at commit time. Run it by hand:
    #   cd api && python -m pytest tests/test_dev_prod_parity.py
    #
    # Before raising this, confirm the service has no disk attached — see the
    # note above: while one is, Render holds the service to a single instance
    # and this field will not take. After that it is a queue-throughput
    # decision (CF-65c): every instance is another Postgres connection and
    # another `standard` worth of cost, and the per-game advisory lock (CF-184)
    # is what keeps two of them off the same game.
    numInstances: 1
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    # A script, not an inline command — same reason as the api above (CF-170).
    dockerCommand: /app/scripts/render-start-worker.sh
    # Off for the same reason as the api, plus one of its own: the worker shares
    # the api's models, so auto-deploying it while the api waits for a manual
    # deploy would run new task code against the old schema. Deploy the two
    # together.
    autoDeploy: false
    envVars:
      - fromGroup: clipfarm-shared
      # Pinned here as well as on the api. The worker inherits clipfarm-shared,
      # and that group exists precisely to set things for both services — so any
      # dev-fallback flag added there arrives here too, on the process that
      # writes to the database. ALLOW_STUB_DETECTIONS is what actually gates
      # fabricated clips (see api/app/config.py); this keeps the general flag
      # from drifting in behind it.
      - key: DEBUG
        value: "false"
      - key: ROBOFLOW_API_KEY
        sync: false
      # NOT optional since CF-164. Ball tracking and pose both run on Modal and
      # this image carries no torch to fall back to, so an unset token means
      # every game degrades to trajectory-only labels. If the ball model is
      # unreachable too, the game FAILS loudly rather than producing anything:
      # the pose-first fallback refuses its local path, because without
      # ultralytics run_detection() returns fabricated stub clips and this
      # pipeline would persist them as real highlights.
      #
      # Enforced since CF-172, not merely documented: with ENVIRONMENT=production
      # the worker refuses to boot without both tokens, naming them. They are
      # checked at worker boot rather than in the shared Settings validator —
      # the api imports the same config and never calls Modal, so failing the
      # web service over a worker credential would be the worse outage.
      - key: MODAL_TOKEN_ID
        sync: false
      - key: MODAL_TOKEN_SECRET
        sync: false
      # Pinned to the PLAN, not the host (CF-224). ffmpeg reads the visible core
      # count — 16 here, the host's — while the cgroup allows 0.5 CPU, so x264
      # defaulted to ~24 encoder threads and its 1080p frame buffers blew the
      # 512 MB limit on the first clip. Every encode now runs with this many.
      #
      # 1, not the code default of 2, and measured rather than picked: under
      # `docker run --memory=512m --cpus=0.5`, a 22 s 1080p cut peaks at 407 MB
      # with 1 thread and 468 MB with 2, and *finishes sooner* with 1 (59 s vs
      # 66-74 s). Half a CPU cannot run two encoder threads in parallel, so the
      # second one buys nothing and costs 60 MB. 4 and unbounded both OOM at
      # ~5 s — the production symptom exactly.
      #
      # Deliberately still 1 after CF-240 took the plan to a whole CPU, where
      # 2 would plausibly win. That measurement was taken at 0.5 CPU and does
      # not carry over, so it gets re-run under CF-223 rather than guessed at
      # here — CF-240 changes one variable. It is set explicitly rather than
      # left to the code default so the coupling is visible next to the plan it
      # depends on.
      # Mirrored by the dev worker in docker-compose.yml and enforced by
      # api/tests/test_dev_prod_parity.py, which .hooks/pre-commit does not run
      # — change this and the compose default together, or find out in CI.
      - key: FFMPEG_THREADS
        value: "1"
      - key: REDIS_URL
        fromService: { type: keyvalue, name: clipfarm-redis, property: connectionString }
      - key: CELERY_BROKER_URL
        fromService: { type: keyvalue, name: clipfarm-redis, property: connectionString }
      - key: CELERY_RESULT_BACKEND
        fromService: { type: keyvalue, name: clipfarm-redis, property: connectionString }
      # No MODEL_CACHE_DIR / INFERENCE_HOME / MODELS_DIR / YOLO_CONFIG_DIR here
      # any more (CF-40's cache): nothing in this image loads a model, so there
      # are no weights to cache. Modal owns the weights — pose's are baked into
      # the clipfarm-pose image, ball's live on the clipfarm-model-cache Volume.
      #
      # No POSE_* overrides either. They pinned the LIGHT config
      # (yolov8n-pose @ 640, every 8th frame) because yolov8s @ 1280 was
      # unproven on a 2 GB CPU box. Pose runs on a T4 now, so app/config.py's
      # full-quality defaults are what production gets — which is the label
      # quality the CF-55 eval baselines were measured against.

  # ── Web (Next.js) ──────────────────────────────────────────────────────────
  # Native Node runtime (not Docker) — Render runs `next start` and injects PORT.
  # NEXT_PUBLIC_* are inlined at BUILD time, so they must be set before deploy.
  - type: web
    name: clipfarm-web
    runtime: node
    repo: https://github.com/ClipFarmVB/ClipFarm
    branch: main
    region: oregon
    plan: starter
    # Both release vars are set here (not in envVars) because NEXT_PUBLIC_* is
    # inlined at build time. They must carry the SAME value:
    #   NEXT_PUBLIC_SENTRY_RELEASE — what the browser SDK tags events with
    #   SENTRY_RELEASE            — what sentry-cli uploads the source maps under
    # Left unset, sentry-cli auto-detects from git, which on a CI-style checkout
    # can differ or resolve to nothing. The maps then upload "successfully" and
    # simply never join the events, so prod traces stay minified with no error.
    buildCommand: npm ci && SENTRY_RELEASE=$RENDER_GIT_COMMIT NEXT_PUBLIC_SENTRY_RELEASE=$RENDER_GIT_COMMIT npm run build --workspace=web
    startCommand: npm run start --workspace=web
    # Off so the three services deploy as a set — a UI auto-shipped ahead of the
    # manually-deployed api can call endpoints that aren't live yet. This is the
    # safest starting point, not a permanent stance: web is the least risky to
    # flip back on once the deploy flow is proven.
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: NEXT_PUBLIC_API_URL      # the API's public URL, e.g. https://api.clipfarm.ca
        sync: false
      # Error monitoring (CF-89) — separate DSN from the api/worker project.
      - key: NEXT_PUBLIC_SENTRY_DSN   # Sentry → clipfarm-web → Settings → Client Keys (DSN)
        sync: false
      - key: NEXT_PUBLIC_SENTRY_ENVIRONMENT
        value: production
      # Source-map upload at build time. Without these, prod web stack traces
      # point at minified bundles. The auth token is a secret — set it in the
      # dashboard, never in this file.
      - key: SENTRY_ORG
        sync: false
      - key: SENTRY_PROJECT
        sync: false
      - key: SENTRY_AUTH_TOKEN
        sync: false
