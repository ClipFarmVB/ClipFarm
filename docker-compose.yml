name: clipfarm

# The image, mounts and env file behind both `worker` and `eval`. What they do
# NOT share is deliberate and lives on each service: the worker carries
# production's resource limits and the broker URLs, eval carries neither.
#
# `image:` is what makes the shared half literally true, not just visually:
# sharing only `build:` would have Compose tag the two services separately and
# build them independently, from whatever the tree held at each build — two
# images that merely look alike in this file. A shared tag means one build,
# reused.
x-worker-image: &worker-image
  image: clipfarm-worker
  build:
    context: .
    dockerfile: Dockerfile.api
  env_file:
    - .env.docker
  volumes:
    - ./api:/app/api
    - ./ml:/app/ml

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # Published on the host (unlike redis) so tools and tests outside the stack
    # can reach it — api/tests' advisory-lock tests (CF-184) auto-detect a local
    # Postgres here and skip without one. Set POSTGRES_HOST_PORT if 5432 is
    # already taken by a Postgres installed on the host.
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clipfarm}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-clipfarm}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # No host port mapping — only reachable by other containers in this network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      # DATABASE_URL comes from .env.docker (local db container by default,
      # shared Supabase as a deliberate opt-in) — do not override here
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy
      # api migrates on boot when DATABASE_URL is local — wait for Postgres to be
      # ready so the migration doesn't race a still-starting db
      db:
        condition: service_healthy
    # auto_migrate.py runs `alembic upgrade head` ONLY when DATABASE_URL names a
    # local host (CF-189). Pointed at Supabase it skips and says so, so no
    # `docker compose up` can advance the shared schema as a side effect —
    # that stays a deliberate, separate step (README § Local Development).
    command: >
      sh -lc "python scripts/auto_migrate.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app/api
      - ./ml:/app/ml

  worker:
    <<: *worker-image
    restart: unless-stopped
    # Production's box, locally (CF-241). Unconstrained, this container gets the
    # whole host — which is precisely why CF-224's OOM could not be reproduced
    # here before it shipped: the bug needs the *divergence* between advertised
    # cores and allocated CPU, and a dev machine telling the truth never creates
    # one. `cpus` is a CFS quota, so `nproc` still reports the host's 16 while
    # only this much CPU is schedulable — the same lie the Render container
    # tells, which is what makes the repro faithful.
    #
    # Track `clipfarm-worker`'s `plan` in render.yaml: `standard` = 2 GB / 1 CPU
    # since CF-240. api/tests/test_dev_prod_parity.py pins the two together.
    #
    # WHY THE DEFAULT IS CAPPED, now that docker-compose.repro.yml exists and can
    # supply CF-224's 512 MB / 0.5 CPU on demand. It is a fair question: 2 GB /
    # 1 CPU reproduces no OOM we know of, and the cap is paid on every local run.
    #
    # Because an opt-in repro only helps someone who already suspects. CF-224 is
    # the third bug of this shape here, after pose silently failing on every game
    # and the `inference` resolver picking a pre-RF-DETR version, and in all three
    # nobody suspected — that is what environment divergence is. The default is
    # what decides whether the *next* one is caught, and repro.yml is for
    # confirming a divergence you have already thought of.
    #
    # What this default buys, stated narrowly: a local run that fits is evidence
    # about production, and a local run on 16 cores and 64 GB is not. It does NOT
    # claim to reproduce CF-224 — that box was half this size, and reproducing it
    # is what the overlay is for. Two honest limits: `api` and `web` are still
    # unconstrained (out of scope per CF-241), so this is parity for one of three
    # services; and `--pool=solo` means the cost lands on every local game, which
    # docker-compose.fast.yml exists to hand back when the question is only
    # \"does the pipeline work\".
    #
    # Both directions are sanctioned, and both are an overlay FILE rather than
    # a remembered prefix — docker-compose.repro.yml (512 MB / 0.5 CPU, to make
    # CF-224's OOM happen on your laptop) and docker-compose.fast.yml (8 GB /
    # 4 CPU, to answer "does the pipeline work" without waiting on one core).
    # Each carries its own rule; read the file before using it.
    #
    #   docker compose --env-file .env.docker \
    #     -f docker-compose.yml -f docker-compose.repro.yml up worker
    #
    # Going bigger costs you the fidelity these limits exist for, so the fast
    # overlay is for "does the pipeline work", never for "does it fit". Any
    # timing or memory claim has to come from a default-limits run.
    #
    # The WORKER_MEM_LIMIT / WORKER_CPUS / WORKER_FFMPEG_THREADS knobs below
    # remain, for a one-off size the overlays do not cover. Note they are read
    # from `.env.docker` too, not just from a prefix, since every documented
    # command passes `--env-file .env.docker` — so a value parked in that file
    # applies to *every* run, silently. Prefer the prefix.
    #
    # memswap_limit equal to mem_limit asks for NO swap. Docker's default is
    # double, i.e. 2 GB of RAM plus 2 GB of swap — under which the repro overlay
    # can decline to OOM while the same encode is killed on Render, which has
    # no swap at all. An unfaithful repro is worse than none: it says "fixed".
    #
    # "Asks", because the kernel has to be accounting for swap for this to bind.
    # Docker warns and ignores both fields on a host without swap accounting
    # enabled (common on stock Linux; Docker Desktop's VM has it). If a 512 MB
    # repro run refuses to OOM, check `docker info` for that warning before
    # believing the result — the limit may simply not have applied.
    # Both read WORKER_MEM_LIMIT, and must keep reading the *same* variable:
    # giving swap its own knob is how you end up with `WORKER_MEM_LIMIT=8g`
    # asking for 8 GB of memory inside a 2 GB memory+swap ceiling, which Docker
    # rejects at container create. The fast path below would stop working.
    mem_limit: ${WORKER_MEM_LIMIT:-2g}
    memswap_limit: ${WORKER_MEM_LIMIT:-2g}
    cpus: ${WORKER_CPUS:-1.0}
    environment:
      # DATABASE_URL comes from .env.docker (local db container by default,
      # shared Supabase as a deliberate opt-in) — do not override here.
      #
      # The broker URLs sit on this service rather than in the shared anchor
      # above so that `eval` cannot pick them up: this is the one that takes
      # queued work.
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      # 1, matching render.yaml, not the code default of 2 (CF-224). Parity is
      # the point: the limits above are worth little if the thing that OOMs
      # under them is configured differently here.
      #
      # Raising it as a *speed* knob means raising WORKER_CPUS with it — threads
      # a container cannot schedule cost memory and buy nothing (CF-224 measured
      # 2 threads at 0.5 CPU as both slower and 60 MB heavier). Raising it to
      # *provoke* the OOM is the opposite move and deliberately unbalanced:
      # docker-compose.repro.yml pairs 4 threads with 0.5 CPU precisely because
      # only 4-or-unbounded blows the 512 MB ceiling. Follow the "raise them
      # together" rule there and the run completes at ~408 MB, reading as
      # "already fixed".
      #
      # The knob is WORKER_FFMPEG_THREADS, deliberately not FFMPEG_THREADS.
      # Same name on both sides would mean the app's own variable doubles as
      # the compose knob: setting FFMPEG_THREADS in .env.docker would then be
      # ignored under a bare `docker compose up` (this `environment:` value
      # beats `env_file:`) and honoured under the README's
      # `--env-file .env.docker` start command, which is what interpolation
      # reads. Namespacing it, like WORKER_MEM_LIMIT and WORKER_CPUS, deletes
      # the difference instead of documenting it.
      FFMPEG_THREADS: "${WORKER_FFMPEG_THREADS:-1}"
      # No POSE_* or MODEL_* vars since CF-164: this image carries no torch, so
      # nothing here loads a model or downloads weights. Ball tracking and pose
      # both run on Modal — set MODAL_TOKEN_ID / MODAL_TOKEN_SECRET in
      # .env.docker to exercise them (`modal deploy ml/modal_app.py` and
      # `modal deploy ml/modal_pose.py` once, first).
      #
      # Without Modal tokens the dev stack still runs end to end: pose
      # refinement no-ops and clips keep their ball-trajectory labels. To do
      # real pose work locally, run the worker outside Docker against
      # ml/requirements.txt — every local path is still in the code.
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      api:
        condition: service_started
    # No model_cache volume since CF-164 (see x-worker-image above): nothing in
    # this image downloads weights, and the top-level volume it referenced is gone.
    command: celery -A app.workers.celery_app worker --loglevel=info --pool=solo

  # The eval harness and the tuning scripts, deliberately *un*constrained.
  #
  # This is the answer to CF-241's known tension: the harness is a CPU-bound
  # offline sweep over cached detections, not a thing production runs, and
  # holding it to one core would make every sweep several times slower for no
  # fidelity gained. Rather than teaching people an env-var incantation they
  # would forget (and then silently benchmark at 1 CPU), eval gets its own
  # service: same image and same mounts, no resource limits, and none of the
  # worker's broker wiring (see below).
  #
  # Profile-gated, so `docker compose up` never starts it. Run one-shot — keep
  # the `--env-file`, it is what Compose interpolates from:
  #   docker compose --env-file .env.docker \
  #     run --rm --no-deps eval python -m ml.eval.harness --help
  #
  # If you are eval-ing something whose *cost* matters — encode timings, memory
  # headroom — use `worker`, not this. Correctness sweeps belong here; anything
  # measuring the production box does not.
  #
  # It is NOT a second worker, and deliberately cannot become one: no
  # `depends_on`, no celery command, and — note the absent `environment:` — no
  # broker URLs. `run --rm eval celery ...` would otherwise take real jobs off
  # the queue and run them unconstrained; with nothing in this repo setting
  # them, Settings falls back to localhost:6379 inside a container that has no
  # redis, so it connects to nothing.
  #
  # "Nothing in this repo": eval still loads `.env.docker`, which is yours, so a
  # CELERY_BROKER_URL set there does reach it and no test can see that. The
  # claim is that this file never hands eval the queue — not that you cannot.
  # To process a game faster, raise the worker's own limits (see above).
  eval:
    <<: *worker-image
    profiles: ["eval"]
    # No FFMPEG_THREADS pin, deliberately. Settings.ffmpeg_threads is read only
    # by recut_clip_task and process_game_task, and nothing under ml/eval imports
    # ml.pipeline.clip, so the setting is never consulted on an eval path. A
    # value pinned here would be config that looks load-bearing and is not.
    #
    # That is narrower than "eval never runs ffmpeg", which would be false:
    # harness.py --offline calls compute_audio_energy, which shells out to ffmpeg
    # for a -vn decode to mono PCM (ml/pipeline/audio.py). It passes no -threads
    # and reads nothing from here, so there is no knob to pin — but it is a real
    # subprocess, and claiming otherwise is the CF-192 failure with the sign
    # flipped. If eval ever grows an encode of its own, give it its own variable
    # then — sharing the worker's would mean retuning one silently retunes the
    # other.
    #
    # Every real invocation passes its own command. Without this, a bare
    # `run eval` or `--profile eval up` would inherit Dockerfile.api's CMD and
    # quietly start a *second uvicorn* — a running web server where you asked
    # for a sweep. Fail with usage instead.
    command:
      - sh
      - -c
      - >-
        echo "eval is a one-shot runner, not a service: pass a command, e.g.
        docker compose --env-file .env.docker run --rm --no-deps eval
        python -m ml.eval.harness --help" >&2;
        exit 64

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    env_file:
      - .env.docker
      - web/.env.local          # real NEXT_PUBLIC_SUPABASE_* + NEXT_PUBLIC_API_URL
    environment:
      # Browsers on the host reach the api container through its mapped port.
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      api:
        condition: service_started
    command: npm --workspace=web run dev -- --hostname 0.0.0.0 --port 3000
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app/web
      - ./package.json:/app/package.json:ro
      - ./package-lock.json:/app/package-lock.json:ro
      - node_modules:/app/node_modules

volumes:
  postgres_data:
  node_modules:
