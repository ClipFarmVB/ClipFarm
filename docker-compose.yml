name: clipfarm

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clipfarm}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-clipfarm}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # No host port mapping — only reachable by other containers in this network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      # DATABASE_URL comes from .env.docker (local db container by default,
      # shared Supabase as a deliberate opt-in) — do not override here
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy
      # api migrates on boot when DATABASE_URL is local — wait for Postgres to be
      # ready so the migration doesn't race a still-starting db
      db:
        condition: service_healthy
    # auto_migrate.py runs `alembic upgrade head` ONLY when DATABASE_URL names a
    # local host (CF-189). Pointed at Supabase it skips and says so, so no
    # `docker compose up` can advance the shared schema as a side effect —
    # that stays a deliberate, separate step (README § Local Development).
    command: >
      sh -lc "python scripts/auto_migrate.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app/api
      - ./ml:/app/ml

  worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      # DATABASE_URL comes from .env.docker (local db container by default,
      # shared Supabase as a deliberate opt-in) — do not override here
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      # Lighter pose settings for CPU dev — production (GPU) uses the
      # defaults in app/config.py (yolov8s-pose @ 1280, every 4th frame).
      POSE_MODEL: yolov8n-pose.pt
      POSE_IMGSZ: "640"
      POSE_SKIP_FRAMES: "8"
      # Persistent model-weight cache (CF-40): without these, every container
      # recreate re-downloads the ball model (114MB, Roboflow CDN) and the
      # YOLO pose weights (GitHub) before processing can start.
      MODEL_CACHE_DIR: /models/roboflow   # inference: model metadata cache
      INFERENCE_HOME: /models/roboflow    # inference 1.x: shared-blobs weight store (the 114MB)
      # Pose weights: the /models volume is empty, the container has no tool to
      # download into it, and appuser can't write it (root-owned) — so pose
      # refinement was silently failing on every game. Point at the model
      # bundled in the image instead (api/yolov8n-pose.pt). NOTE: this resolves
      # the bundled yolov8n only; a non-bundled prod model (e.g. yolov8s-pose)
      # must be added to the image or seeded into a writable models dir.
      MODELS_DIR: /app/api
      YOLO_CONFIG_DIR: /tmp/ultralytics   # writable by appuser (unlike /models)
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      api:
        condition: service_started
    command: celery -A app.workers.celery_app worker --loglevel=info --pool=solo
    volumes:
      - ./api:/app/api
      - ./ml:/app/ml
      - model_cache:/models

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    env_file:
      - .env.docker
      - web/.env.local          # real NEXT_PUBLIC_SUPABASE_* + NEXT_PUBLIC_API_URL
    environment:
      # Browsers on the host reach the api container through its mapped port.
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      api:
        condition: service_started
    command: npm --workspace=web run dev -- --hostname 0.0.0.0 --port 3000
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app/web
      - ./package.json:/app/package.json:ro
      - ./package-lock.json:/app/package-lock.json:ro
      - node_modules:/app/node_modules

volumes:
  postgres_data:
  node_modules:
  model_cache:
