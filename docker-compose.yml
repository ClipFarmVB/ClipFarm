name: clipfarm

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # Published on the host (unlike redis) so tools and tests outside the stack
    # can reach it — api/tests' advisory-lock tests (CF-184) auto-detect a local
    # Postgres here and skip without one. Set POSTGRES_HOST_PORT if 5432 is
    # already taken by a Postgres installed on the host.
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clipfarm}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-clipfarm}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # No host port mapping — only reachable by other containers in this network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      # DATABASE_URL comes from .env.docker (local db container by default,
      # shared Supabase as a deliberate opt-in) — do not override here
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy
      # api migrates on boot when DATABASE_URL is local — wait for Postgres to be
      # ready so the migration doesn't race a still-starting db
      db:
        condition: service_healthy
    # auto_migrate.py runs `alembic upgrade head` ONLY when DATABASE_URL names a
    # local host (CF-189). Pointed at Supabase it skips and says so, so no
    # `docker compose up` can advance the shared schema as a side effect —
    # that stays a deliberate, separate step (README § Local Development).
    command: >
      sh -lc "python scripts/auto_migrate.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app/api
      - ./ml:/app/ml

  worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      # DATABASE_URL comes from .env.docker (local db container by default,
      # shared Supabase as a deliberate opt-in) — do not override here
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      # The code default (2) is sized for the 512 MB / 0.5 CPU production worker
      # (CF-224); a dev machine has real cores, so encode a bit wider here.
      # Keep it bounded anyway — this container sees the host's core count too.
      FFMPEG_THREADS: "4"
      # No POSE_* or MODEL_* vars since CF-164: this image carries no torch, so
      # nothing here loads a model or downloads weights. Ball tracking and pose
      # both run on Modal — set MODAL_TOKEN_ID / MODAL_TOKEN_SECRET in
      # .env.docker to exercise them (`modal deploy ml/modal_app.py` and
      # `modal deploy ml/modal_pose.py` once, first).
      #
      # Without Modal tokens the dev stack still runs end to end: pose
      # refinement no-ops and clips keep their ball-trajectory labels. To do
      # real pose work locally, run the worker outside Docker against
      # ml/requirements.txt — every local path is still in the code.
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      api:
        condition: service_started
    command: celery -A app.workers.celery_app worker --loglevel=info --pool=solo
    # No model_cache volume since CF-164: nothing in this image downloads
    # weights, and the top-level volume it referenced is gone.
    volumes:
      - ./api:/app/api
      - ./ml:/app/ml

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    env_file:
      - .env.docker
      - web/.env.local          # real NEXT_PUBLIC_SUPABASE_* + NEXT_PUBLIC_API_URL
    environment:
      # Browsers on the host reach the api container through its mapped port.
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      api:
        condition: service_started
    command: npm --workspace=web run dev -- --hostname 0.0.0.0 --port 3000
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app/web
      - ./package.json:/app/package.json:ro
      - ./package-lock.json:/app/package-lock.json:ro
      - node_modules:/app/node_modules

volumes:
  postgres_data:
  node_modules:
