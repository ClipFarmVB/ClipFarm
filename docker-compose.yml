name: clipfarm

# The worker and the eval container are the same image with the same mounts and
# the same broker; they differ only in whether production's resource limits
# apply (see the `worker` and `eval` services below).
#
# `image:` is what makes that literally true, not just visually: sharing only
# `build:` would have Compose tag the two services separately and build them
# independently, from whatever the tree held at each build — two images that
# merely look alike in this file. A shared tag means one build, reused.
x-worker-image: &worker-image
  image: clipfarm-worker
  build:
    context: .
    dockerfile: Dockerfile.api
  env_file:
    - .env.docker
  volumes:
    - ./api:/app/api
    - ./ml:/app/ml

x-worker-env: &worker-env
  # DATABASE_URL comes from .env.docker (local db container by default,
  # shared Supabase as a deliberate opt-in) — do not override here
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # Published on the host (unlike redis) so tools and tests outside the stack
    # can reach it — api/tests' advisory-lock tests (CF-184) auto-detect a local
    # Postgres here and skip without one. Set POSTGRES_HOST_PORT if 5432 is
    # already taken by a Postgres installed on the host.
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clipfarm}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-clipfarm}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # No host port mapping — only reachable by other containers in this network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      # DATABASE_URL comes from .env.docker (local db container by default,
      # shared Supabase as a deliberate opt-in) — do not override here
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy
      # api migrates on boot when DATABASE_URL is local — wait for Postgres to be
      # ready so the migration doesn't race a still-starting db
      db:
        condition: service_healthy
    # auto_migrate.py runs `alembic upgrade head` ONLY when DATABASE_URL names a
    # local host (CF-189). Pointed at Supabase it skips and says so, so no
    # `docker compose up` can advance the shared schema as a side effect —
    # that stays a deliberate, separate step (README § Local Development).
    command: >
      sh -lc "python scripts/auto_migrate.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app/api
      - ./ml:/app/ml

  worker:
    <<: *worker-image
    restart: unless-stopped
    # Production's box, locally (CF-241). Unconstrained, this container gets the
    # whole host — which is precisely why CF-224's OOM could not be reproduced
    # here before it shipped: the bug needs the *divergence* between advertised
    # cores and allocated CPU, and a dev machine telling the truth never creates
    # one. `cpus` is a CFS quota, so `nproc` still reports the host's 16 while
    # only this much CPU is schedulable — the same lie the Render container
    # tells, which is what makes the repro faithful.
    #
    # Track `clipfarm-worker`'s `plan` in render.yaml: `standard` = 2 GB / 1 CPU
    # since CF-240. api/tests/test_dev_prod_parity.py pins the two together.
    #
    # Overridable in BOTH directions, and both are sanctioned — one command,
    # no continuations, so it survives a copy-paste:
    #
    #   Smaller, to reproduce CF-224's OOM on your laptop:
    #     WORKER_MEM_LIMIT=512m WORKER_CPUS=0.5 FFMPEG_THREADS=4 docker compose up worker
    #
    #   Bigger, to iterate on a local end-to-end run without waiting on
    #   production's single core (see README § Local Development):
    #     WORKER_MEM_LIMIT=8g WORKER_CPUS=4 FFMPEG_THREADS=4 docker compose up worker
    #
    # Going bigger costs you the fidelity these limits exist for, so it is for
    # "does the pipeline work", never for "does it fit". Any timing or memory
    # claim has to come from a default-limits run.
    #
    # memswap_limit equal to mem_limit means NO swap. Docker's default is
    # double, i.e. 2 GB of RAM plus 2 GB of swap — under which the repro above
    # can decline to OOM while the same encode is killed on Render, which has
    # no swap at all. An unfaithful repro is worse than none: it says "fixed".
    # Both read WORKER_MEM_LIMIT, and must keep reading the *same* variable:
    # giving swap its own knob is how you end up with `WORKER_MEM_LIMIT=8g`
    # asking for 8 GB of memory inside a 2 GB memory+swap ceiling, which Docker
    # rejects at container create. The fast path below would stop working.
    mem_limit: ${WORKER_MEM_LIMIT:-2g}
    memswap_limit: ${WORKER_MEM_LIMIT:-2g}
    cpus: ${WORKER_CPUS:-1.0}
    environment:
      <<: *worker-env
      # 1, matching render.yaml, not the code default of 2 (CF-224). Parity is
      # the point: the limits above are worth little if the thing that OOMs
      # under them is configured differently here. Raise it together with
      # WORKER_CPUS, never on its own.
      #
      # This is an `environment:` value, which BEATS `env_file:` — so setting
      # FFMPEG_THREADS in .env.docker does nothing. The interpolation above
      # reads the shell, or `.env`, or whatever `--env-file` names: the README's
      # `docker compose --env-file .env.docker up` does pick it up from there,
      # a bare `docker compose up` does not. Prefix the command to be sure.
      FFMPEG_THREADS: "${FFMPEG_THREADS:-1}"
      # No POSE_* or MODEL_* vars since CF-164: this image carries no torch, so
      # nothing here loads a model or downloads weights. Ball tracking and pose
      # both run on Modal — set MODAL_TOKEN_ID / MODAL_TOKEN_SECRET in
      # .env.docker to exercise them (`modal deploy ml/modal_app.py` and
      # `modal deploy ml/modal_pose.py` once, first).
      #
      # Without Modal tokens the dev stack still runs end to end: pose
      # refinement no-ops and clips keep their ball-trajectory labels. To do
      # real pose work locally, run the worker outside Docker against
      # ml/requirements.txt — every local path is still in the code.
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      api:
        condition: service_started
    # No model_cache volume since CF-164 (see x-worker-image above): nothing in
    # this image downloads weights, and the top-level volume it referenced is gone.
    command: celery -A app.workers.celery_app worker --loglevel=info --pool=solo

  # The eval harness and the tuning scripts, deliberately *un*constrained.
  #
  # This is the answer to CF-241's known tension: the harness is a CPU-bound
  # offline sweep over cached detections, not a thing production runs, and
  # holding it to one core would make every sweep several times slower for no
  # fidelity gained. Rather than teaching people an env-var incantation they
  # would forget (and then silently benchmark at 1 CPU), eval gets its own
  # service. Same image, same mounts, same broker — only the limits differ.
  #
  # Profile-gated, so `docker compose up` never starts it. Run one-shot:
  #   docker compose run --rm --no-deps eval python -m ml.eval.harness --help
  #
  # If you are eval-ing something whose *cost* matters — encode timings, memory
  # headroom — use `worker`, not this. Correctness sweeps belong here; anything
  # measuring the production box does not.
  #
  # It is NOT a second worker — no `depends_on` and no celery command, so
  # `up` cannot give it queued work. It does inherit the broker URLs from
  # x-worker-env, so `run --rm eval celery ...` would take real jobs and run
  # them unconstrained; don't. To process a game faster, raise the worker's own
  # limits (see its comment above) rather than reaching for this.
  eval:
    <<: *worker-image
    profiles: ["eval"]
    # No FFMPEG_THREADS pin, deliberately. Settings.ffmpeg_threads is read only
    # by recut_clip_task and process_game_task; every eval entry point stops at
    # _track_ball_cached and the condense arithmetic, so nothing here encodes and
    # the setting is never consulted. A value pinned here would be config that
    # looks load-bearing and is not. If eval ever grows an encode, give it its
    # own variable then — sharing the worker's would mean retuning one silently
    # retunes the other.
    environment:
      <<: *worker-env
    # Every real invocation passes its own command. Without this, a bare
    # `run eval` or `--profile eval up` would inherit Dockerfile.api's CMD and
    # quietly start a *second uvicorn* — a running web server where you asked
    # for a sweep. Fail with usage instead.
    command:
      - sh
      - -c
      - >-
        echo "eval is a one-shot runner, not a service: pass a command, e.g.
        docker compose run --rm --no-deps eval python -m ml.eval.harness --help" >&2;
        exit 64

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    env_file:
      - .env.docker
      - web/.env.local          # real NEXT_PUBLIC_SUPABASE_* + NEXT_PUBLIC_API_URL
    environment:
      # Browsers on the host reach the api container through its mapped port.
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      api:
        condition: service_started
    command: npm --workspace=web run dev -- --hostname 0.0.0.0 --port 3000
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app/web
      - ./package.json:/app/package.json:ro
      - ./package-lock.json:/app/package-lock.json:ro
      - node_modules:/app/node_modules

volumes:
  postgres_data:
  node_modules:
