name: clipfarm

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clipfarm}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-clipfarm}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # No host port mapping — only reachable by other containers in this network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      # DATABASE_URL comes from .env.docker (Supabase) — do not override here
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy
    command: >
      sh -lc "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app/api
      - ./ml:/app/ml

  worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      # DATABASE_URL comes from .env.docker (Supabase) — do not override here
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      # Lighter pose settings for CPU dev — production (GPU) uses the
      # defaults in app/config.py (yolov8s-pose @ 1280, every 4th frame).
      POSE_MODEL: yolov8n-pose.pt
      POSE_IMGSZ: "640"
      POSE_SKIP_FRAMES: "8"
      # Persistent model-weight cache (CF-40): without these, every container
      # recreate re-downloads the ball model (114MB, Roboflow CDN) and the
      # YOLO pose weights (GitHub) before processing can start.
      MODEL_CACHE_DIR: /models/roboflow   # inference: model metadata cache
      INFERENCE_HOME: /models/roboflow    # inference 1.x: shared-blobs weight store (the 114MB)
      MODELS_DIR: /models                 # ultralytics weights (see ml/pipeline/detect.py)
      YOLO_CONFIG_DIR: /models/ultralytics  # ultralytics settings.json
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_started
    command: celery -A app.workers.celery_app worker --loglevel=info --pool=solo
    volumes:
      - ./api:/app/api
      - ./ml:/app/ml
      - model_cache:/models

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    env_file:
      - .env.docker
      - web/.env.local          # real NEXT_PUBLIC_SUPABASE_* + NEXT_PUBLIC_API_URL
    environment:
      # Browsers on the host reach the api container through its mapped port.
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      api:
        condition: service_started
    command: npm --workspace=web run dev -- --hostname 0.0.0.0 --port 3000
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app/web
      - ./package.json:/app/package.json:ro
      - ./package-lock.json:/app/package-lock.json:ro
      - node_modules:/app/node_modules

volumes:
  postgres_data:
  node_modules:
  model_cache:
