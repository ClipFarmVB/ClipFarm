name: Approve probe (TEMPORARY)

# TEMPORARY — DELETE AFTER CF-105 (#128) RESOLVES.
#
# Answers one question and nothing else: does an approving review submitted by
# the Claude GitHub App satisfy `required_approving_review_count: 1` on the
# main-protection ruleset?
#
# Why a probe at all: CF-105's whole design rests on that being true, and every
# other path is blocked or expensive.
#   - GITHUB_TOKEN / github-actions[bot] cannot approve here at all — the repo
#     reports `can_approve_pull_request_reviews: false`, and both controls are
#     greyed out because the org policy pins them. Loosening that would let every
#     workflow in every ClipFarmVB repo approve PRs, which is far too broad a
#     change for this feature.
#   - claude[bot] is a third-party App, so that Actions policy does not apply to
#     it. This probe tests exactly that path and nothing else.
#
# Run it against a throwaway PR, read the result, then delete this file.

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to approve (use a throwaway PR)"
        required: true

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  probe:
    name: Approve probe
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Needed only so the diagnostics script below exists on disk. The probe
      # deliberately does NOT check out the PR under test — it must not read the
      # diff, only approve.
      - uses: actions/checkout@v4

      - name: Approve as claude[bot]
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # No skill, no review — a single deterministic action so the result is
          # unambiguous. If the approval does not appear, the cause is the
          # mechanism rather than the model deciding the code was unworthy.
          prompt: |
            Submit an approving review on pull request ${{ github.repository }}#${{ inputs.pr_number }}
            by running exactly:

              gh pr review ${{ inputs.pr_number }} --repo ${{ github.repository }} --approve --body "Approval mechanism probe (CF-105). Not a code review."

            Do not review the code. Do not read the diff. Do not do anything else.
            Report the command's exit status and any error text verbatim.
          claude_args: "--max-turns 6"

      - name: Probe result (redacted)
        if: always()
        continue-on-error: true
        run: |
          log="${RUNNER_TEMP}/claude-execution-output.json"
          script=".github/scripts/review_diagnostics.py"
          if [ -f "$log" ] && [ -f "$script" ]; then
            python3 "$script" "$log" || true
          else
            echo "probe: no execution log or diagnostics script available"
          fi
