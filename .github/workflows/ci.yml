name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    # NOTE: this job also runs vitest now. Do not rename it to match — the name
    # is a required status check by exact string in the main-protection ruleset,
    # so renaming stops that context reporting and blocks every PR until the
    # ruleset is updated to match. Same trap as the api job below.
    name: Web (lint + typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --workspace=web --workspace=packages/api-client
      - run: npm run lint --workspace=web
      - run: npm run typecheck --workspace=web
      # The shared api client is its own workspace (CF-314). web's tsc already
      # sees the source it imports; this checks the package on its own tsconfig,
      # which is what a React Native consumer will compile it under.
      - run: npm run typecheck --workspace=packages/api-client
      # Unit tests for web/ (CF-96). Pure logic, no browser — runs in ~1s.
      - run: npm run test --workspace=web
      # The suites that moved into the package with their modules (CF-314).
      # Without this line they stop running anywhere and nothing goes red.
      - run: npm run test --workspace=packages/api-client

  api:
    name: API (ruff + mypy)
    runs-on: ubuntu-latest
    # Throwaway Postgres for the CF-184 advisory-lock tests. They assert what
    # the *database* does — mutual exclusion, and a session lock dying with its
    # connection — which no test double can stand in for, and which is the whole
    # reason the per-game lock moved off Redis. Nothing else in api/tests needs
    # it; without LOCK_TEST_DATABASE_URL set below they skip.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          # Named explicitly: setup-python's default pip glob is
          # `**/requirements.txt`, which matches neither of the files this job
          # actually installs. Without this, bumping a pin below does not
          # invalidate the cache key.
          cache-dependency-path: |
            requirements-tooling.txt
            api/requirements-dev.txt
            api/requirements.txt
      # Pinned (CF-92) — an upstream release must not be able to change CI's
      # answer on a branch nobody touched. Add a tool to requirements-tooling.txt
      # rather than appending it to this line;
      # test_ci_installs_the_tooling_file_rather_than_naming_tools_inline
      # enforces that, and test_every_tool_ci_installs_is_pinned enforces the
      # pin itself.
      #
      # A separate `pip install` step is fine when ORDER matters — see the numpy
      # one below, which has to run after mypy and is pinned in place. What the
      # guard forbids is an install target with no `==`, wherever it appears.
      - run: pip install -r requirements-tooling.txt
      - run: ruff check api/
      - run: mypy api/app --ignore-missing-imports
      # Lint all of ml/, not just ml/eval: ml/tests and ml/pipeline sit beside
      # ml/eval rather than under it, so the narrower glob never reached them
      # (CF-254). mypy stays on ml/eval, and that is a hold rather than a
      # permanent split: widening it is a behaviour change for ml/pipeline
      # (one missing annotation today, not a rewrite) and belongs on its own
      # card instead of riding along with a lint-scope fix.
      - run: ruff check ml/
      - run: mypy ml/eval --ignore-missing-imports --explicit-package-bases --namespace-packages
      # numpy is installed AFTER the lint/type steps, for the same reason the api
      # dependencies below are: ruff and mypy are tuned against a dependency-free
      # environment, and numpy ships py.typed, so its presence changes what
      # --ignore-missing-imports resolves and hence the error set mypy reports.
      #
      # Pinned to the version the worker image and api tests use
      # (ml/requirements.txt, api/requirements-dev.txt). Unpinned it resolves to
      # numpy 2.x, so the guarded builder's speed math would be validated here
      # against a different major version than anything that runs it.
      - run: pip install "numpy==1.26.4"
      # ml unit tests (eval metrics + dead-time) — stdlib + numpy, runs in seconds.
      - run: python -m pytest ml/tests/
      # api unit tests now need the application's own dependencies:
      # app.observability imports app.config, which imports pydantic-settings.
      # CF-102 anticipated this and deliberately deferred the install until
      # something actually required it; test_observability.py is that moment.
      #
      # Installed HERE rather than beside the tooling install above,
      # so ruff and mypy keep running in the dependency-free environment they
      # were tuned against. With the real packages present, mypy
      # --ignore-missing-imports resolves stubs it previously skipped and
      # reports a different, larger error set — worth doing deliberately, not as
      # a side effect of this fix.
      #
      # requirements-DEV.txt, not requirements.txt: it pulls the runtime deps in
      # via `-r requirements.txt` and adds the test-only ones. It is what stops
      # tests passing by skipping — each import a test guards on has to be
      # installed here, and test-only packages must not move into
      # requirements.txt, which ships them into the production image.
      - run: pip install -r api/requirements-dev.txt
      # working-directory is api/ so `from app... import ...` resolves.
      #
      # NOTE: do not rename this job to match what it actually runs. "API (ruff
      # + mypy)" is a required status check by exact name in the main-protection
      # ruleset — renaming stops that context reporting and blocks every PR
      # until the ruleset is updated to match.
      - run: python -m pytest tests/
        working-directory: api
        env:
          LOCK_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
